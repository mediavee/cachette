name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  rust-version:
    name: build on the declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets

  musl:
    name: musl build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --target x86_64-unknown-linux-musl

  public:
    name: public repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The design notes behind this repo are not public: a reference to them is a dead end for
      # every reader, so a comment states its reason instead.
      - run: |
          if git grep -nIP '\bD[0-9]{1,2}\b' -- . ':!Cargo.lock' ':!bench/results' \
             || git grep -nIi 'chan[t]ier' -- . ':!bench/results'; then
            echo "::error::reference to private design notes: state the reason in place"
            exit 1
          fi

  bench-image:
    name: bench image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The bench builds cachette from source through its own ignore file; nothing else
      # builds this image, so a change to the release image context can break it unseen.
      - run: docker build -f bench/cachette.Dockerfile -t cachette-bench .
